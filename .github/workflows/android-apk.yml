
name: Build MaxLedger Android APK

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Verify Android SDK
        run: |
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Generate Android project
        run: npx cap add android

      - name: Allow opening exported files (FileProvider paths)
        run: |
          mkdir -p android/app/src/main/res/xml
          cat > android/app/src/main/res/xml/file_paths.xml <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <paths xmlns:android="http://schemas.android.com/apk/res/android">
              <files-path name="files" path="." />
              <cache-path name="cache" path="." />
              <external-files-path name="external-files" path="." />
              <external-cache-path name="external-cache" path="." />
              <external-path name="external" path="." />
          </paths>
          XML
      
      - name: Generate MaxLedger app icon
        run: npx --yes @capacitor/assets generate --android

      - name: Copy Firebase Android configuration
        run: cp google-services.json android/app/google-services.json

      - name: Configure Google authentication dependencies
        run: |
          sed -i "/ext {/a\\    rgcfaIncludeGoogle = true\\n    androidxCredentialsVersion = '1.3.0'" android/variables.gradle
          cat android/variables.gradle

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Prepare Android signing key directory
        run: mkdir -p "$HOME/.config/.android"

      - name: Restore persistent Android debug key
        uses: actions/cache@v4
        with:
          path: ~/.config/.android/debug.keystore
          key: maxledger-android-debug-keystore-v2

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Generate signing fingerprints
        run: |
          cd android
          ./gradlew signingReport

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk android/app/build/outputs/apk/debug/Maxledger.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Maxledger-APK
          path: android/app/build/outputs/apk/debug/Maxledger.apk
          if-no-files-found: error
          retention-days: 30
          
